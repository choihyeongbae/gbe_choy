<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>포항시 안전비상벨 찾기</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    :root{--red:#E53935;--red-dark:#B71C1C;--red-light:#FFEBEE;--red-soft:#FFCDD2;--bg:#F5F5F5;--card:#FFF;--card-hover:#FAFAFA;--text:#212121;--text-dim:#757575;--text-light:#9E9E9E;--safe:#2E7D32;--safe-bg:#E8F5E9;--warn:#E65100;--warn-bg:#FFF3E0;--border:#E0E0E0;--shadow:rgba(0,0,0,0.08);--blue:#1565C0;--blue-soft:#E3F2FD}
    *{margin:0;padding:0;box-sizing:border-box}body{font-family:'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh}
    .header{background:linear-gradient(135deg,var(--red-dark),var(--red));padding:16px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(229,57,53,.25);position:relative;z-index:1000;color:#fff}
    .header .bell-icon{width:42px;height:42px;background:rgba(255,255,255,.2);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;animation:bellRing 2s ease-in-out infinite}
    @keyframes bellRing{0%,100%{transform:rotate(0)}10%{transform:rotate(14deg)}20%{transform:rotate(-14deg)}30%{transform:rotate(8deg)}40%{transform:rotate(-4deg)}50%{transform:rotate(0)}}
    .header h1{font-size:18px;font-weight:800;letter-spacing:-.5px}.header .sub{font-size:11px;color:rgba(255,255,255,.75);margin-top:2px}
    .header .badge{margin-left:auto;background:rgba(255,255,255,.2);padding:4px 10px;border-radius:20px;font-size:12px;font-weight:600}
    #map{width:100%;height:45vh;height:45dvh;border-bottom:3px solid var(--red)}
    .gps-section{padding:16px 20px;display:flex;gap:10px;background:var(--card);border-bottom:1px solid var(--border)}
    .btn-gps{flex:1;background:linear-gradient(135deg,var(--red),var(--red-dark));border:none;color:#fff;padding:14px 20px;border-radius:14px;font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;box-shadow:0 4px 16px rgba(229,57,53,.25)}
    .btn-gps:hover{transform:translateY(-1px);box-shadow:0 6px 24px rgba(229,57,53,.35)}.btn-gps:active{transform:translateY(0)}.btn-gps:disabled{opacity:.6;cursor:not-allowed;transform:none}
    .btn-gps .spinner{width:18px;height:18px;border:2.5px solid rgba(255,255,255,.3);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
    @keyframes spin{to{transform:rotate(360deg)}}
    .btn-icon{width:48px;height:48px;background:var(--card);border:1px solid var(--border);color:var(--text);border-radius:14px;font-size:20px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s,border-color .2s,color .2s}
    .btn-icon:hover{background:var(--card-hover)}.btn-icon.active{background:var(--blue-soft);border-color:var(--blue);color:var(--blue)}
    .result-card{margin:16px 20px;background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--border);box-shadow:0 4px 20px var(--shadow);display:none}
    .result-card.show{display:block;animation:slideUp .4s ease}
    @keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
    .result-header{background:var(--red-light);padding:16px 18px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--red-soft)}
    .distance-badge{min-width:72px;text-align:center;background:linear-gradient(135deg,var(--red),var(--red-dark));color:#fff;padding:8px 12px;border-radius:12px}
    .distance-badge .num{font-size:22px;font-weight:800;line-height:1}.distance-badge .unit{font-size:10px;color:rgba(255,255,255,.8);margin-top:2px}
    .result-name{font-size:16px;font-weight:700}.result-addr{font-size:12px;color:var(--text-dim);margin-top:4px;line-height:1.4}
    .result-body{padding:14px 18px}.info-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .info-item{background:var(--bg);padding:10px 12px;border-radius:10px;border:1px solid var(--border)}
    .info-item .label{font-size:10px;color:var(--text-light);margin-bottom:4px;text-transform:uppercase;letter-spacing:.5px}
    .info-item .value{font-size:13px;font-weight:600;line-height:1.4}.info-item .value.yes{color:var(--safe)}.info-item .value.no{color:var(--warn)}.info-item .value.blue{color:var(--blue)}
    .result-footer{padding:0 18px 16px;display:flex;gap:8px}
    .btn-navi{flex:1;background:var(--safe);border:none;color:#fff;padding:12px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
    .btn-call{flex:1;background:var(--card);border:1px solid var(--border);color:var(--text);padding:12px;border-radius:10px;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px}
    .btn-call:hover{background:var(--bg)}
    .stats-section{margin:16px 20px 24px}.stats-title{font-size:15px;font-weight:800;margin-bottom:12px;display:flex;align-items:center;gap:8px}
    .stats-title::before{content:'';width:4px;height:18px;background:var(--red);border-radius:2px}
    .stats-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
    .stat-card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:16px 12px;text-align:center;box-shadow:0 2px 8px var(--shadow);position:relative;overflow:hidden}
    .stat-card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;background:var(--red)}
    .stat-card .stat-num{font-size:28px;font-weight:800;color:var(--red);line-height:1}.stat-card .stat-label{font-size:11px;color:var(--text-dim);margin-top:6px;font-weight:600}.stat-card .stat-sub{font-size:10px;color:var(--text-light);margin-top:2px}
    .stats-detail{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .detail-card{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;box-shadow:0 2px 8px var(--shadow)}
    .detail-card .dc-label{font-size:11px;color:var(--text-dim);font-weight:600;margin-bottom:8px}
    .detail-bar{display:flex;align-items:center;gap:8px;margin-bottom:6px}.detail-bar:last-child{margin-bottom:0}
    .detail-bar .db-name{font-size:12px;min-width:50px}.detail-bar .db-track{flex:1;height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
    .detail-bar .db-fill{height:100%;border-radius:4px;transition:width .6s ease}.detail-bar .db-fill.red{background:var(--red)}.detail-bar .db-fill.orange{background:#FF9800}
    .detail-bar .db-val{font-size:12px;font-weight:700;min-width:28px;text-align:right}
    .list-panel{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-radius:20px 20px 0 0;max-height:70vh;overflow-y:auto;transform:translateY(100%);transition:transform .3s ease;z-index:2000;box-shadow:0 -8px 40px rgba(0,0,0,.15)}
    .list-panel.open{transform:translateY(0)}.list-handle{text-align:center;padding:12px;cursor:pointer}
    .list-handle::before{content:'';display:inline-block;width:40px;height:4px;background:var(--border);border-radius:2px}
    .list-title{padding:0 20px 12px;font-size:16px;font-weight:700}
    .list-item{padding:14px 20px;border-top:1px solid var(--border);display:flex;align-items:center;gap:12px;cursor:pointer;transition:background .15s}
    .list-item:hover{background:var(--bg)}.list-item .li-icon{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
    .li-icon.police{background:var(--safe-bg)}.li-icon.no-police{background:var(--warn-bg)}
    .list-item .li-name{font-size:14px;font-weight:600}.list-item .li-addr{font-size:11px;color:var(--text-dim);margin-top:2px}
    .list-item .li-dist{margin-left:auto;font-size:13px;font-weight:700;color:var(--red);flex-shrink:0}
    .overlay{position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:1999;opacity:0;pointer-events:none;transition:opacity .3s}.overlay.show{opacity:1;pointer-events:auto}
    .bell-marker{background:none;border:none}
    .marker-pin{width:30px;height:30px;background:var(--red);border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.25);border:2px solid #fff}
    .marker-pin span{transform:rotate(45deg);font-size:13px}
    .marker-pin.nearest{background:var(--safe);width:36px;height:36px;animation:pulse 1.5s ease infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(46,125,50,.5)}50%{box-shadow:0 0 0 12px rgba(46,125,50,0)}}
    .user-marker{width:18px;height:18px;background:#1565C0;border:3px solid #fff;border-radius:50%;box-shadow:0 0 0 6px rgba(21,101,192,.2),0 2px 8px rgba(0,0,0,.2)}
    .leaflet-popup-content-wrapper{background:var(--card)!important;color:var(--text)!important;border-radius:12px!important;box-shadow:0 4px 20px rgba(0,0,0,.15)!important;border:1px solid var(--border)!important}
    .leaflet-popup-tip{background:var(--card)!important}.leaflet-popup-content{margin:12px 14px!important;font-family:'Noto Sans KR',sans-serif!important}
    .toast{position:fixed;top:80px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--text);color:#fff;padding:10px 20px;border-radius:12px;font-size:13px;z-index:3000;opacity:0;transition:all .3s;pointer-events:none;white-space:nowrap;box-shadow:0 4px 16px rgba(0,0,0,.2)}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .footer{text-align:center;padding:16px 20px 24px;font-size:11px;color:var(--text-light);line-height:1.6}
    @media(max-width:420px){.gps-section{padding:14px}.result-card,.stats-section{margin-left:14px;margin-right:14px}}
  </style>
</head>
<body>
<div class="header"><div class="bell-icon">🔔</div><div><h1>포항시 안전비상벨</h1><div class="sub">가장 가까운 비상벨을 찾아드립니다</div></div><div class="badge">34개소</div></div>
<div id="map"></div>
<div class="gps-section">

  <button class="btn-icon" id="btnCompass" onclick="requestCompassPermission()" title="방향 센서 활성화">🧭</button>
  <button class="btn-icon" onclick="toggleList()">☰</button>
</div>
<div class="result-card" id="resultCard">

  <div class="result-body"><div class="info-grid">

    <div class="info-item"><div class="label">부가 기능</div><div class="value" id="resExtras">-</div></div>
    <div class="info-item"><div class="label">최종 점검</div><div class="value" id="resCheck">-</div></div>
    <div class="info-item"><div class="label">현재 폰 방향</div><div class="value blue" id="resHeading">-</div></div>
    <div class="info-item"><div class="label">비상벨 방향 안내</div><div class="value blue" id="resDirection">-</div></div>
  </div></div>
  <div class="result-footer"><button class="btn-navi" onclick="openNavi()">🧭 카카오맵 길찾기</button><button class="btn-call" onclick="callMgmt()">📞 관리기관 연락</button></div>
</div>
<div class="stats-section">
  <div class="stats-title">포항시 안전비상벨 현황</div>
  <div class="stats-grid">

  </div>
  <div class="stats-detail">
    <div class="detail-card"><div class="dc-label">설치 목적별</div><div class="detail-bar"><div class="db-name">약자보호</div><div class="db-track"><div class="db-fill red" style="width:73.5%"></div></div><div class="db-val">25</div></div><div class="detail-bar"><div class="db-name">방범용</div><div class="db-track"><div class="db-fill orange" style="width:26.5%"></div></div><div class="db-val">9</div></div></div>
    <div class="detail-card"><div class="dc-label">구별 분포</div><div class="detail-bar"><div class="db-name">북구</div><div class="db-track"><div class="db-fill red" style="width:58.8%"></div></div><div class="db-val">20</div></div><div class="detail-bar"><div class="db-name">남구</div><div class="db-track"><div class="db-fill orange" style="width:41.2%"></div></div><div class="db-val">14</div></div></div>
  </div>
</div>
<div class="footer">공공데이터포털 안전비상벨 위치정보 기반<br>데이터 기준일: 2024 · 포항여자고등학교 AI 프로젝트</div>

function haversine(lat1,lon1,lat2,lon2){const R=6371000,toRad=d=>d*Math.PI/180;const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a))}
function bearingBetween(lat1,lon1,lat2,lon2){const toRad=d=>d*Math.PI/180,toDeg=r=>r*180/Math.PI;const p1=toRad(lat1),p2=toRad(lat2),dl=toRad(lon2-lon1);const y=Math.sin(dl)*Math.cos(p2);const x=Math.cos(p1)*Math.sin(p2)-Math.sin(p1)*Math.cos(p2)*Math.cos(dl);return(toDeg(Math.atan2(y,x))+360)%360}
function normalizeAngle(d){while(d>180)d-=360;while(d<-180)d+=360;return d}
function smoothHeading(h){if(lastSmoothedHeading==null){lastSmoothedHeading=h;return h}const d=normalizeAngle(h-lastSmoothedHeading);lastSmoothedHeading=(lastSmoothedHeading+d*0.25+360)%360;return lastSmoothedHeading}
function getDirectionName(d){return['북','북동','동','남동','남','남서','서','북서'][Math.round(d/45)%8]}
function getRelativeDirection(tb,ch){const d=normalizeAngle(tb-ch),a=Math.abs(d);if(a<=15)return'정면';if(a<=45)return d>0?'오른쪽 '+Math.round(a)+'°':'왼쪽 '+Math.round(a)+'°';if(a<=100)return d>0?'오른쪽 앞 '+Math.round(a)+'°':'왼쪽 앞 '+Math.round(a)+'°';if(a<=150)return d>0?'오른쪽 뒤 '+Math.round(a)+'°':'왼쪽 뒤 '+Math.round(a)+'°';return'뒤쪽'}
function formatDist(d){if(d==null)return'';return d>=1000?(d/1000).toFixed(1)+'km':Math.round(d)+'m'}
function showToast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}

/* ===== 나침반: absolute 우선, fallback 분리 ===== */
function requestCompassPermission(){
  if(compassStarted){showToast('방향 센서가 이미 활성화되어 있습니다');return}
  if(typeof DeviceOrientationEvent==='undefined'){showToast('이 기기에서는 방향 센서를 지원하지 않습니다');return}
  if(typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission().then(s=>{
      if(s==='granted'){startCompass();showToast('방향 센서가 활성화되었습니다')}
      else showToast('방향 센서 권한이 필요합니다')
    }).catch(()=>showToast('방향 센서 권한 요청에 실패했습니다'))
  }else{startCompass();showToast('방향 센서가 활성화되었습니다')}
}
function startCompass(){
  if(compassStarted)return;compassStarted=true;
  document.getElementById('btnCompass').classList.add('active');
  window.addEventListener('deviceorientationabsolute',onAbsoluteOrientation,true);
  window.addEventListener('deviceorientation',onFallbackOrientation,true);
}
function autoStartCompass(){
  if(typeof DeviceOrientationEvent==='undefined')return;
  if(typeof DeviceOrientationEvent.requestPermission==='function')return;
  startCompass();
}

function onAbsoluteOrientation(e){
  if(e.alpha==null||isNaN(e.alpha))return;
  hasAbsoluteOrientation=true;
  applyHeading(e.alpha%360);
}
function onFallbackOrientation(e){
  if(hasAbsoluteOrientation)return;
  let h=null;
  if(e.webkitCompassHeading!=null&&!isNaN(e.webkitCompassHeading)){h=(e.webkitCompassHeading+90)%360}
  else if(e.absolute===true&&e.alpha!=null&&!isNaN(e.alpha)){h=e.alpha%360}
  if(h==null||isNaN(h))return;
  applyHeading(h);
}
function applyHeading(raw){
  deviceHeading=smoothHeading((raw+360)%360);
  updateDirectionInfo();updateMapDirectionArrow();
}

/* ===== 방향 표시 ===== */
function updateDirectionInfo(){
  const hEl=document.getElementById('resHeading'),dEl=document.getElementById('resDirection');
  if(deviceHeading==null){hEl.textContent='센서 비활성'}
  else{hEl.textContent=getDirectionName(deviceHeading)+' ('+Math.round(deviceHeading)+'°)'}
  if(!nearestBell||userLat==null){dEl.textContent='먼저 최근접 비상벨을 탐색하세요';return}
  const tb=bearingBetween(userLat,userLng,nearestBell.lat,nearestBell.lng);
  const tn=getDirectionName(tb);
  if(deviceHeading==null){dEl.textContent=tn+' 방향 ('+Math.round(tb)+'°)'}
  else{dEl.textContent=tn+' 방향 · '+getRelativeDirection(tb,deviceHeading)}
}
function updateMapDirectionArrow(){
  if(!nearestBell||userLat==null)return;
  const tb=bearingBetween(userLat,userLng,nearestBell.lat,nearestBell.lng);
  // 나침반 활성: 폰이 향하는 방향 기준 상대각도 (사용자가 폰 들고 따라갈 수 있게)
  // 나침반 비활성: 절대 방위 (지도 북쪽 기준)
  const angle=deviceHeading!=null?(tb-deviceHeading+360)%360:tb;
  if(directionArrowMarker)map.removeLayer(directionArrowMarker);
  directionArrowMarker=L.marker([userLat,userLng],{icon:createDirectionArrowIcon(angle),zIndexOffset:900}).addTo(map);
}

/* ===== 지도 ===== */
function initMap(){
  map=L.map('map',{zoomControl:false}).setView([36.04,129.38],11);
  L.control.zoom({position:'topright'}).addTo(map);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',{attribution:'&copy; OpenStreetMap &copy; CARTO',maxZoom:19}).addTo(map);
  BELLS.forEach(b=>{
    const m=L.marker([b.lat,b.lng],{icon:createBellIcon(false)}).addTo(map);
    m.bindPopup('<div style="min-width:180px"><div style="font-weight:700;font-size:14px;margin-bottom:6px;color:#212121">'+b.location+'</div><div style="font-size:11px;color:#757575;margin-bottom:8px;line-height:1.4">'+b.address+'</div><div style="display:flex;gap:6px;flex-wrap:wrap"><span style="background:'+(b.purpose==='약자보호'?'#FFEBEE':'#E3F2FD')+';color:'+(b.purpose==='약자보호'?'#C62828':'#1565C0')+';padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600">'+b.purpose+'</span><span style="background:'+(b.policeLinked==='Y'?'#E8F5E9':'#FFF3E0')+';color:'+(b.policeLinked==='Y'?'#2E7D32':'#E65100')+';padding:2px 8px;border-radius:6px;font-size:11px;font-weight:600">경찰'+(b.policeLinked==='Y'?' ✓':' ✗')+'</span></div></div>');
    markers.push({marker:m,bell:b});
  });
  buildList();
}

/* ===== GPS ===== */
function startTrackingNearest(){
  const btn=document.getElementById('btnGps');
  if(!navigator.geolocation){showToast('이 브라우저에서는 GPS를 지원하지 않습니다');return}
  btn.disabled=true;btn.innerHTML='<div class="spinner"></div> 위치 확인 중...';
  if(watchId!==null){navigator.geolocation.clearWatch(watchId);watchId=null}
  navigator.geolocation.getCurrentPosition(p=>{
    updateUserPosition(p.coords,true);
    btn.disabled=false;btn.innerHTML='<span>📍</span> 내 위치에서 가장 가까운 비상벨 찾기';
    showToast('실시간 위치 추적이 시작되었습니다');
    watchId=navigator.geolocation.watchPosition(w=>updateUserPosition(w.coords,false),()=>showToast('실시간 위치 추적이 일시적으로 불안정합니다'),{enableHighAccuracy:true,maximumAge:0,timeout:15000});
  },err=>{
    btn.disabled=false;btn.innerHTML='<span>📍</span> 내 위치에서 가장 가까운 비상벨 찾기';
    showToast(err.code===1?'위치 접근이 거부되었습니다.':'위치를 가져올 수 없습니다');
  },{enableHighAccuracy:true,maximumAge:0,timeout:15000});
}
function updateUserPosition(c,fit){
  userLat=c.latitude;userLng=c.longitude;const acc=c.accuracy||15;
  if(userMarker)userMarker.setLatLng([userLat,userLng]);
  else userMarker=L.marker([userLat,userLng],{icon:createUserIcon(),zIndexOffset:1000}).addTo(map);
  if(accuracyCircle){accuracyCircle.setLatLng([userLat,userLng]);accuracyCircle.setRadius(acc)}
  else accuracyCircle=L.circle([userLat,userLng],{radius:acc,color:'#1565C0',weight:1,opacity:.35,fillColor:'#1565C0',fillOpacity:.10}).addTo(map);
  let md=Infinity,mi=-1;
  BELLS.forEach((b,i)=>{const d=haversine(userLat,userLng,b.lat,b.lng);if(d<md){md=d;mi=i}});
  if(nearestMarkerRef)nearestMarkerRef.setIcon(createBellIcon(false));
  nearestBell=BELLS[mi];nearestMarkerRef=markers[mi].marker;nearestMarkerRef.setIcon(createBellIcon(true));
  const ds=md>=1000?(md/1000).toFixed(1):Math.round(md),us=md>=1000?'km':'m';
  document.getElementById('resDist').textContent=ds;document.getElementById('resUnit').textContent=us;
  document.getElementById('resName').textContent=nearestBell.location;document.getElementById('resAddr').textContent=nearestBell.address;
  document.getElementById('resPurpose').textContent=nearestBell.purpose;
  const pe=document.getElementById('resPolice');pe.textContent=nearestBell.policeLinked==='Y'?'연계됨 ✓':'미연계';pe.className='value '+(nearestBell.policeLinked==='Y'?'yes':'no');
  document.getElementById('resExtras').textContent=nearestBell.extras||'없음';document.getElementById('resCheck').textContent=nearestBell.lastCheck;
  document.getElementById('resultCard').classList.add('show');
  if(window._line)map.removeLayer(window._line);
  window._line=L.polyline([[userLat,userLng],[nearestBell.lat,nearestBell.lng]],{color:'#E53935',weight:3,dashArray:'8 8',opacity:.7}).addTo(map);
  updateDirectionInfo();updateMapDirectionArrow();buildList();
  if(!hasFittedOnce||fit){map.fitBounds(L.latLngBounds([[userLat,userLng],[nearestBell.lat,nearestBell.lng]]),{padding:[60,60],maxZoom:17});hasFittedOnce=true}
  else map.panTo([userLat,userLng],{animate:true,duration:.8});
}

/* ===== 리스트 ===== */
function buildList(){
  const s=BELLS.map((b,i)=>({...b,idx:i,dist:userLat!==null?haversine(userLat,userLng,b.lat,b.lng):null}));
  if(userLat!==null)s.sort((a,b)=>a.dist-b.dist);
  document.getElementById('listContent').innerHTML=s.map(b=>'<div class="list-item" onclick="focusBell('+b.idx+')"><div class="li-icon '+(b.policeLinked==='Y'?'police':'no-police')+'">🔔</div><div><div class="li-name">'+b.location+'</div><div class="li-addr">'+b.address.replace('경상북도 포항시 ','')+'</div></div>'+(b.dist!=null?'<div class="li-dist">'+formatDist(b.dist)+'</div>':'')+'</div>').join('');
}
function focusBell(i){map.setView([BELLS[i].lat,BELLS[i].lng],16);markers[i].marker.openPopup();toggleList()}
function toggleList(){document.getElementById('listPanel').classList.toggle('open');document.getElementById('overlay').classList.toggle('show')}
function openNavi(){if(!nearestBell){showToast('먼저 가장 가까운 비상벨을 탐색해주세요');return}window.open('https://map.kakao.com/link/to/'+encodeURIComponent(nearestBell.location)+','+nearestBell.lat+','+nearestBell.lng,'_blank')}
function callMgmt(){if(!nearestBell){showToast('먼저 가장 가까운 비상벨을 탐색해주세요');return}const p=nearestBell.mgmtPhone.replace(/[^0-9-]/g,'');if(p)window.location.href='tel:'+p;else showToast('관리기관 전화번호가 없습니다')}

initMap();autoStartCompass();updateDirectionInfo();
</script>
